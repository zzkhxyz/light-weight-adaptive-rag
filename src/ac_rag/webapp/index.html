<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171719">
  <title>Поиск по документу</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="intro">
      <h1>Поиск по документу</h1>
      <p>Загрузите файл или используйте пример</p>
    </header>

    <section class="section" aria-labelledby="document-title">
      <h2 id="document-title">Документ</h2>
      <div id="document-picker">
        <div class="example-row">
          <div class="example-copy">
            <strong>Пример: возмещение расходов</strong>
            <span>Памятка на одну страницу</span>
          </div>
          <button type="button" class="button button-secondary" id="sample-button">Выбрать пример</button>
        </div>
        <a class="download-link" href="/example/document" download>Скачать пример</a>
        <div class="separator" aria-hidden="true"></div>
        <div class="upload-area" id="drop-zone">
          <label class="button button-secondary upload-label" for="file-input">Загрузить файл</label>
          <span>TXT, MD, PDF, DOCX до 5 МБ</span>
          <input type="file" id="file-input" accept=".txt,.md,.pdf,.docx" aria-label="Загрузить документ">
        </div>
      </div>

      <div class="loaded-document" id="loaded-document" hidden>
        <div class="loaded-copy"><span>Выбран документ</span><strong id="document-name"></strong></div>
        <button type="button" class="text-button" id="change-document">Заменить</button>
      </div>
      <div class="inline-status" id="upload-status" role="status" aria-live="polite"></div>
    </section>

    <section class="section question-section" aria-labelledby="question-title">
      <h2 id="question-title">Вопрос</h2>
      <form class="question-form" id="question-form">
        <label for="question-input" class="sr-only">Вопрос по документу</label>
        <textarea id="question-input" rows="3" placeholder="Например, можно ли возместить такси после 22:00" maxlength="4000" disabled required></textarea>
        <button type="submit" class="button button-primary" id="ask-button" disabled>Найти ответ</button>
      </form>
      <div class="suggestions" id="suggestions" hidden>
        <span>Примеры вопросов</span>
        <button type="button" data-question="Можно ли вернуть деньги за такси после рабочей встречи в 23:00?">Такси после встречи</button>
        <button type="button" data-question="Сколько дней есть, чтобы подать чек?">Срок подачи чека</button>
        <button type="button" data-question="Нужно ли согласование для покупки за 12 000 рублей?">Покупка за 12 000 ₽</button>
      </div>
      <div class="inline-status" id="query-status" role="status" aria-live="polite"></div>
    </section>

    <section class="answer-panel" id="answer-panel" aria-live="polite" aria-labelledby="answer-title" hidden>
      <h2 id="answer-title">Ответ</h2>
      <p class="answer-text" id="answer-text"></p>
      <div id="source-block" hidden>
        <h3>Источник</h3>
        <div class="source-name" id="source-name"></div>
        <p class="source-text" id="source-text"></p>
      </div>
      <p class="answer-note" id="answer-note"></p>
    </section>

    <footer>Текст документа сохраняется на этом сервере</footer>
  </main>
</body>
</html>
