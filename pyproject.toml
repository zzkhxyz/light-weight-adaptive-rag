[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ac-rag-engine"
version = "0.1.0"
description = "Adaptive and corrective retrieval augmented generation service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "qdrant-client>=1.9,<2",
  "sentence-transformers>=3,<6",
  "rank-bm25>=0.2.2,<1",
  "openai>=1.55,<3",
  "httpx>=0.27,<1",
  "pypdf>=4,<7",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
ac-rag = "ac_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
